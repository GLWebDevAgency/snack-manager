# Sonde de production — Cloudflare Workers
#
# La sonde EST DÉJÀ DÉPLOYÉE et tourne : ce fichier ne sert qu'à la
# redéployer le jour où son code change. Voir docs/SONDE-PRODUCTION.md
# § « Redéployer la sonde » pour les trois voies possibles — dont deux ne
# demandent aucun jeton.
#
# Déploiement en ligne de commande :
#   CLOUDFLARE_API_TOKEN=… CLOUDFLARE_ACCOUNT_ID=… npx --yes wrangler@4 deploy
#
# Ce jeton-là doit porter « Workers Scripts : Edit » ET « Workers KV Storage :
# Edit ». Celui des sauvegardes (`CLOUDFLARE_API_TOKEN` côté GitHub) ne porte
# que R2 : il ne suffit pas ici, et il ne FAUT PAS l'élargir — deux jetons
# étroits valent mieux qu'un jeton large, le jour où l'un des deux fuite.
# Créer un second jeton, donc. À noter : le message d'erreur d'un jeton trop
# étroit parle d'une ressource introuvable, jamais d'un droit manquant.
#
# Le secret SM_ALERT_WEBHOOK ne figure pas ici, et ne doit jamais y figurer :
#   npx wrangler@4 secret put SM_ALERT_WEBHOOK
# ou, plus simplement, par le tableau de bord (Settings → Variables → Encrypt).
# Le slug du premier restaurant, lui, sera une variable TEXTE publique nommée
# SM_SLUG_CARTE_PRODUCTION. Tant qu'elle est absente, sa carte est ignorée.

name = "sonde-snack-manager"
main = "worker.js"
compatibility_date = "2026-08-01"

# Toutes les 5 minutes. Le plan gratuit l'autorise sans quota : 8 640 passages
# par mois pour 100 000 requêtes par jour incluses.
[triggers]
crons = ["*/5 * * * *"]

# La mémoire de la sonde : `etat` et `dernier-passage`. C'est elle qui permet
# de ne notifier qu'au CHANGEMENT d'état, et d'annoncer la reprise.
[[kv_namespaces]]
binding = "SONDE"
id = "563f07d5244e4d1582eac6dd8189f586"

# Exposé sur snackmanager.workers.dev pour consulter l'état depuis un
# téléphone. Aucune donnée sensible : les mêmes surfaces publiques que
# `scripts/smoke.mjs`, rien de plus.
workers_dev = true

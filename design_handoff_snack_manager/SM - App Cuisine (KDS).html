<style>
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(1200px 700px at 50% -10%, #14161a, #0c0d10 60%, #060708); overflow: hidden; }
  .kds-switch { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; gap: 4px; background: rgba(15,17,20,0.92); border: 1px solid rgba(245,246,247,0.14); border-radius: 999px; padding: 5px; backdrop-filter: blur(8px); }
  .kds-switch button { font-family: 'Inter'; font-weight: 700; font-size: 12px; color: #8b8f98; background: transparent; border: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .kds-switch button.on { background: var(--cf-accent); color: #fff; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: center center; }
  @keyframes kds-flash { 0%,100%{ box-shadow: 0 0 0 1px var(--cf-accent), 0 0 0 0 rgba(201,75,63,0.5);} 50%{ box-shadow: 0 0 0 1px var(--cf-accent), 0 0 0 8px rgba(201,75,63,0);} }
  .kds-new { animation: kds-flash 1.4s ease-in-out infinite; }
  @media print {
    body { background: #fff; overflow: visible; }
    .kds-switch, .cf-btn { display: none !important; }
    #stage { transform: none !important; }
    #cf-receipt { box-shadow: none !important; }
  }
</style>

<body>
<div class="kds-switch" id="switch"></div>
<div id="stage"><div id="root"></div></div>
<script type="text/babel" src="app/cf-ui.jsx"></script>
<script type="text/babel" src="app/sm-brand.jsx"></script>
<script type="text/babel" src="app/kds-app.jsx"></script>
<script type="text/babel">
  const modes = [["tablet", "Tablette"], ["phone", "Téléphone"], ["ticket", "Ticket"]];
  let mode = "tablet";
  const root = ReactDOM.createRoot(document.getElementById('root'));
  function render() {
    root.render(<window.KDSApp mode={mode} key={mode} />);
    document.querySelectorAll('.kds-switch button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    setTimeout(fit, 40); setTimeout(fit, 300);
  }
  const sw = document.getElementById('switch');
  modes.forEach(([m, label]) => { const b = document.createElement('button'); b.textContent = label; b.dataset.m = m; b.onclick = () => { mode = m; render(); }; sw.appendChild(b); });
  function fit() {
    const stage = document.getElementById('stage');
    const dims = { tablet: [1208, 838], phone: [392, 812], ticket: [340, 640] };
    const [w, h] = dims[mode];
    const iw = window.innerWidth, ih = window.innerHeight;
    if (iw < 50 || ih < 50) { requestAnimationFrame(fit); return; }
    const s = Math.max(0.05, Math.min(1, (ih - 80) / h, (iw - 40) / w));
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  render();
</script>

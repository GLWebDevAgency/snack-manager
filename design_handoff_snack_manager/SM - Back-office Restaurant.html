<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.AdminApp />);
  function fit() {
    const stage = document.getElementById('stage');
    const w = window.innerWidth, h = window.innerHeight;
    if (w < 50 || h < 50) { requestAnimationFrame(fit); return; }
    const s = Math.max(0.05, Math.min(1, (h - 24) / 862, (w - 24) / 1360));
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 60); setTimeout(fit, 400);
</script>

name: CI

# ─────────────────────────────────────────────────────────────────────────────
# CE FICHIER EST LA DÉFINITION UNIQUE DE LA VÉRIFICATION.
#
# Il ne l'a pas toujours été : `deploy.yml` en RECOPIAIT les étapes, faute de
# pouvoir conditionner un déploiement sans y toucher. Toute modification faite
# ici devait donc être reportée à la main là-bas, et les deux définitions
# pouvaient diverger SANS QUE RIEN NE LE SIGNALE — on croyait déployer du code
# vérifié par ce fichier alors qu'on le vérifiait avec une copie périmée.
#
# `workflow_call` supprime la copie : `deploy.yml` APPELLE ce fichier
# (`uses: ./.github/workflows/ci.yml`). Une seule définition, une seule chose à
# modifier, plus de dérive possible. Voir docs/CI-CD.md § 13.
# ─────────────────────────────────────────────────────────────────────────────

# Deux déclencheurs, deux rôles :
#   · pull_request → vérifier AVANT de fusionner (c'est ce contrôle que la
#     protection de « main » exige, sous le nom « Vérification du monorepo ») ;
#   · workflow_call → être appelé par `deploy.yml`, sur `develop` comme sur
#     `main`, pour vérifier LE COMMIT QU'ON S'APPRÊTE À METTRE EN LIGNE.
#
# ⚠️ `push: branches: [main]` a été RETIRÉ, et ce n'est pas un oubli.
# `deploy.yml` se déclenche déjà sur ce même push et appelle ce fichier : le
# garder aurait fait tourner la vérification DEUX FOIS sur chaque commit de
# main — deux exécutions du même travail, deux fois le temps, deux fois la
# facture, pour un seul verdict utile. Ce qu'on perdait à le retirer — le
# réchauffage du cache Turborepo de `main`, dont vivent les pull requests — est
# conservé : l'appel depuis `deploy.yml` tourne sur la référence `main`, donc
# `actions/cache` y écrit dans la même portée qu'avant.
#
# ⚠️ Contrepartie à connaître : sur un push vers `main`, la vérification ne
# tourne plus que si `deploy.yml` est présent sur `main`. Les deux fichiers
# voyagent ensemble dans la même fusion — ne les séparez pas. Voir § 13.
on:
  pull_request:
  workflow_call:

# Une PR qu'on repousse trois fois de suite n'a pas besoin de trois CI : on
# annule la précédente.
#
# Appelé par `deploy.yml`, en revanche, on n'annule JAMAIS : `github.event_name`
# vaut alors `push`, et une vérification coupée en cours de route déclarerait en
# échec un déploiement qui n'a rien fait de mal. Le groupe reste distinct de
# celui de `deploy.yml` (`deploiement-…`) : deux groupes identiques entre
# appelant et appelé se bloqueraient mutuellement, pour toujours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Le cache distant Turborepo est explicitement coupé : rien ne sort du
  # dépôt, et aucun jeton n'est nécessaire. Le cache LOCAL, lui, est restauré
  # d'une exécution à l'autre par actions/cache (étape plus bas).
  TURBO_FLAGS: '--cache=local:rw,remote: --output-logs=new-only'
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  # La CI compile des bundles non déployés, fermés sur le socle local. Les
  # déploiements remplacent cette paire explicitement dans deploy.yml.
  EXPO_PUBLIC_API_URL: http://localhost:3001
  EXPO_PUBLIC_SITE_URL: http://localhost:3000
  EXPO_PUBLIC_ALLOW_LOCAL_API: 1

jobs:
  verification:
    name: Vérification du monorepo
    runs-on: ubuntu-latest
    # Budget annoncé : moins de dix minutes. Le garde-fou est au-dessus pour
    # laisser voir un dépassement plutôt que de le masquer par un timeout serré.
    timeout-minutes: 20
    services:
      redis:
        # Official multi-architecture manifest, resolved for Redis 8.10.1-alpine.
        # Ephemeral test-only service; never an application Redis target.
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 127.0.0.1:6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        # Digest multi-architecture officiel de postgres:17.6-alpine3.22.
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          # Identifiants volontairement génériques : ce conteneur éphémère
          # n'est joignable que depuis le runner et ne doit pas apprendre au
          # dépôt à tolérer des URL qui ressemblent à de vrais secrets.
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: snackmanager_loyalty_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d snackmanager_loyalty_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        # Image officielle, manifeste 8.0.29-noble vérifié avec buildx.
        # Standalone volontaire : les services de facturation ne doivent pas
        # compter sur des transactions absentes du Mongo staging actuel.
        image: mongo:8.0.29-noble@sha256:021b2d5ae9d253f2cca17491cc8d03aed8df3c840f3252066aa62d3277fc406e
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer pnpm
        # Aucune version ici : action-setup lit le champ « packageManager » du
        # package.json racine. Une seule source de vérité pour pnpm.
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # `.nvmrc` est la source de vérité commune aux postes, à la CI et aux
          # autres workflows. `engines.node` garde la borne minimale supportée.
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Restaurer le cache Turborepo
        uses: actions/cache@v6
        with:
          # Turborepo 2 range ses artefacts dans .turbo/cache. On ne met en
          # cache que ce dossier : le reste de .turbo (démon, journaux) n'a
          # aucune valeur d'une exécution à l'autre.
          path: .turbo/cache
          # Clé unique par commit — actions/cache n'écrase jamais une clé
          # existante, donc une clé fixe ne serait sauvegardée qu'une fois.
          # Le repli restore-keys récupère le cache de l'exécution précédente.
          key: turbo-${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-

      - name: Installer les dépendances
        # --frozen-lockfile : si le lockfile ne correspond plus aux
        # package.json, la CI s'arrête ici au lieu de résoudre en douce des
        # versions différentes de celles du poste de développement.
        run: pnpm install --frozen-lockfile

      # Les quatre vérifications sont des étapes distinctes pour que l'échec
      # soit lisible d'un coup d'œil dans l'interface GitHub. Turborepo ignore
      # silencieusement les paquets qui ne déclarent pas la tâche demandée. Le
      # paquet supply possède désormais ses tests de migration ; les autres
      # absences éventuelles ne font pas échouer Turbo.
      - name: Typage
        run: pnpm exec turbo run typecheck $TURBO_FLAGS

      # BLOQUANTE depuis le 22 août 2026. Elle ne l'a pas toujours été :
      # eslint-config-next (Next 16) érige react-hooks/set-state-in-effect en
      # erreur, et apps/web en sortait 45 PRÉEXISTANTES, jamais passées en CI.
      # L'étape a donc tourné en `continue-on-error` le temps de les solder —
      # bloquer dès le premier jour aurait interdit TOUTE fusion, y compris un
      # correctif de production un vendredi soir.
      #
      # La dette est soldée : `turbo run lint` sort en 0 sur les 9 paquets. Le
      # `continue-on-error` et l'étape de signalement qui l'accompagnait sont
      # retirés — une erreur d'analyse statique barre désormais la route, comme
      # le typage et les tests. Voir docs/CI-CD.md § 9.
      - name: Analyse statique
        run: pnpm exec turbo run lint $TURBO_FLAGS

      # Le journal de checkout exige de vraies transactions IndexedDB entre
      # onglets : un faux stockage mémoire ne valide pas sa durabilité.
      - name: Navigateur des tests IndexedDB
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        # Chaque suite Vitest a déjà ses workers ; plusieurs paquets peuvent
        # sinon lancer leurs navigateurs/processus natifs en même temps.
        # Séquencer les paquets conserve tous les tests et leurs délais.
        run: pnpm exec turbo run test --concurrency=1 $TURBO_FLAGS

      - name: Gardes des outils de reprise Mongo
        run: pnpm --filter @sm/api exec vitest run ../../scripts/reprise-mongo.test.mjs --root ../..

      - name: Tests du smoke public — réponses HTTP locales
        run: pnpm --filter @sm/api exec vitest run ../../scripts/smoke.test.mjs --root ../..

      # Ces outils vivent hors des packages Turbo : leur validation doit aussi
      # bloquer une livraison. Aucun secret ni service distant n'est utilisé.
      - name: Vérifier les outils opérateur — préflight et financement client
        run: |
          pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler \
            --strict --noUncheckedIndexedAccess --skipLibCheck --esModuleInterop \
            scripts/customer-account-preflight.ts scripts/customer-account-preflight.test.ts \
            scripts/customer-account-operator.ts scripts/customer-account-operator.test.ts
          pnpm --filter @sm/api exec vitest run \
            ../../scripts/customer-account-preflight.test.ts \
            ../../scripts/customer-account-operator.test.ts --root ../..

      # Les suites générales restent rapides et hermétiques. Ces fichiers
      # sont ensuite rejoués séquentiellement contre un vrai PostgreSQL : le
      # bootstrap des rôles et propriétaires, les migrations, RLS, triggers et
      # ledger ne peuvent plus se déclarer verts en ayant été ignorés.
      - name: Tests PostgreSQL réels — bootstrap et fidélité
        env:
          POSTGRES_BOOTSTRAP_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/snackmanager_loyalty_test_ci
          LOYALTY_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/snackmanager_loyalty_test_ci
          LOYALTY_CANONICAL_SALE_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/snackmanager_loyalty_test_ci
        run: |
          pnpm --filter @sm/postgres-bootstrap exec vitest run src/bootstrap.integration.test.ts
          pnpm --filter @sm/loyalty exec vitest run src/schema.integration.test.ts
          pnpm --filter @sm/loyalty exec vitest run src/canonical-sale.integration.test.ts
          pnpm --filter @sm/api exec vitest run src/modules/loyalty/loyalty-member.service.integration.test.ts

      - name: Tests MongoDB et PostgreSQL réels — reprise des gains fidélité
        env:
          LOYALTY_CANONICAL_SALE_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/snackmanager_loyalty_test_ci
          CUSTOMER_ORDERS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_runtime_test_earn
        run: >-
          pnpm --filter @sm/api exec vitest run
          src/modules/loyalty/loyalty-earn-receipt.reader.integration.test.ts
          src/modules/loyalty/loyalty-order-earn.processor.integration.test.ts
          --maxWorkers=1 --no-file-parallelism

      - name: Tests PostgreSQL réels — identité client et quotas durables
        env:
          # Base de connexion déjà créée par le service PostgreSQL ; la fixture
          # dérive sa propre base customer UUID. Aucun appel Verify réel.
          CUSTOMER_TEST_DATABASE_URL: postgresql://user:password@127.0.0.1:5432/snackmanager_loyalty_test_ci
          CUSTOMER_ORDERS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_runtime_test_customer
        run: pnpm --filter @sm/customer test:integration

      - name: Tests MongoDB réels — commandes privées et isolation des comptes
        env:
          CUSTOMER_ORDERS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_runtime_test_customer
        run: pnpm --filter @sm/api exec vitest run src/modules/orders/customer-orders.integration.test.ts

      - name: Tests MongoDB réels — notifications durables de commande
        env:
          # Base dérivée avec UUID, contrôlée avant tout nettoyage. Le service
          # push reste simulé ; aucun serveur Mongo applicatif n'est lu.
          ORDER_NOTIFICATIONS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_order_notifications_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/order-notifications/order-notifications.mongo.test.ts

      - name: Tests MongoDB et Redis réels — domaines des wallets
        env:
          # Base Mongo distincte suffixée UUID ; Redis ne touche que des clés
          # UUID sur la base 15, sans FLUSHDB. Aucun appel Stripe réel.
          PAYMENT_DOMAINS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_payment_domains_test_ci
          PAYMENT_DOMAINS_TEST_REDIS_URL: redis://127.0.0.1:6381/15
        run: pnpm --filter @sm/api exec vitest run src/modules/payment-domains/payment-domains.integration.test.ts

      - name: Tests Redis réels — quotas de rattachement fidélité
        env:
          LOYALTY_ATTACHMENT_TEST_REDIS_URL: redis://127.0.0.1:6381/0
        run: pnpm --filter @sm/api exec vitest run src/modules/customer-identity/customer-loyalty-attachment.quota.integration.test.ts

      - name: Tests MongoDB réels — émission durable des factures
        env:
          # Le test dérive une base suffixée aléatoirement et vérifie sa
          # propriété avant nettoyage. Aucun secret ni serveur externe.
          BILLING_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_billing_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/crm/invoice-issuance.integration.test.ts

      - name: Tests MongoDB réels — concurrence paiement, annulation et remboursements
        env:
          # Faux provider uniquement ; base différente, suffixée par chaque run.
          ORDER_PAYMENT_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_payment_test_ci
        run: >-
          pnpm --filter @sm/api exec vitest run
          src/modules/ordering/order-payment-lifecycle.integration.test.ts
          src/modules/ordering/order-refunds.integration.test.ts
          --maxWorkers=1 --no-file-parallelism

      - name: Tests MongoDB réels — admission et reprise de commande
        env:
          ORDER_RECOVERY_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_recovery_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/orders/public-order-admission.integration.test.ts

      - name: Tests MongoDB réels — tables et admissions de salle
        env:
          DINING_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_dining_test_ci
          DINING_PRICING_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_dining_pricing_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/orders/dining.integration.test.ts src/modules/orders/dining-pricing.test.ts

      - name: Tests MongoDB réels — accès livreur et révocation
        env:
          DELIVERY_OPERATOR_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_test_ci
          DELIVERY_OPERATOR_HTTP_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_http_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/delivery/delivery-operators.integration.test.ts src/modules/delivery/delivery-access.http.integration.test.ts

      - name: Tests MongoDB réels — affectation et départ des missions livreur
        env:
          DELIVERY_MISSION_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_mission_test_ci
          DELIVERY_MISSION_HTTP_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_mission_http_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/delivery/delivery-missions.integration.test.ts src/modules/delivery/delivery-missions.http.integration.test.ts

      - name: Tests MongoDB réels — preuve de remise, dérogation et reprise livreur
        env:
          DELIVERY_HANDOFF_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_handoff_test_ci
          DELIVERY_HANDOFF_HTTP_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_delivery_handoff_http_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/delivery/delivery-handoff.integration.test.ts src/modules/delivery/delivery-handoff.http.integration.test.ts src/modules/delivery/delivery-handoff.browser.integration.test.ts

      - name: Tests MongoDB réels — promotion et compteur concurrent
        env:
          ENGAGE_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_engage_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/engage/engage.promotions.test.ts

      # Le failpoint de construction est GLOBAL au daemon : un conteneur
      # éphémère distinct évite d'affecter les autres suites Mongo ci-dessus.
      - name: Tests MongoDB réels — construction des index de capacité
        env:
          ORDER_CAPACITY_INDEX_TEST_MONGO_URL: mongodb://127.0.0.1:27018/snackmanager_index_test_ci
          ORDER_CAPACITY_INDEX_FAILPOINTS: '1'
        run: |
          SM_CAPACITY_TEST_CONTAINER=$(docker run --detach --rm --publish 127.0.0.1:27018:27017 \
            mongo:8.0.29-noble@sha256:021b2d5ae9d253f2cca17491cc8d03aed8df3c840f3252066aa62d3277fc406e \
            mongod --bind_ip_all --setParameter enableTestCommands=1)
          [[ "$SM_CAPACITY_TEST_CONTAINER" =~ ^[a-f0-9]{64}$ ]]
          trap 'docker stop "$SM_CAPACITY_TEST_CONTAINER" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$SM_CAPACITY_TEST_CONTAINER" mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$SM_CAPACITY_TEST_CONTAINER" mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
          pnpm --filter @sm/api exec vitest run src/modules/orders/order-capacity-index-readiness.test.ts src/modules/orders/order-capacity-index-readiness.integration.test.ts

      - name: Tests MongoDB réels — capacité et bootstrap reprenable
        env:
          ORDER_CAPACITY_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_capacity_test_ci
          ORDER_CAPACITY_CALENDAR_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_calendar_test_ci
          ORDER_CAPACITY_SETTINGS_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_settings_test_ci
          ORDER_CAPACITY_READER_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_reader_test_ci
          ORDER_CAPACITY_BOOTSTRAP_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_bootstrap_test_ci
          ORDER_CAPACITY_CLI_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_capacity_cli_test_ci
          ORDER_CAPACITY_RUNTIME_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_runtime_test_ci
          STAFF_ORDER_ATTEMPT_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_runtime_test_staff
        run: |
          pnpm --filter @sm/db exec vitest run src/order-capacity-immutability.test.ts
          pnpm --filter @sm/api exec vitest run src/modules/orders/order-capacity-commit.integration.test.ts src/modules/ordering/order-capacity-calendar.store.integration.test.ts src/modules/tenants/tenant-capacity-settings.store.integration.test.ts src/modules/ordering/order-capacity-bootstrap.reader.integration.test.ts
          pnpm --filter @sm/api exec vitest run src/modules/ordering/order-capacity-bootstrap.store.integration.test.ts src/modules/orders/order-capacity-runtime.integration.test.ts src/modules/orders/staff-order-attempt.integration.test.ts
          pnpm --filter @sm/api exec vitest run src/maintenance/order-capacity-bootstrap.cli.integration.test.ts

      # L'expiration du verrou Redis ne doit jamais vendre une place deux fois.
      # Cette preuve reste bloquante : ni continue-on-error, ni skip.
      - name: Régression runtime — dernière place après expiration Redis
        env:
          ORDER_SLOT_TEST_MONGO_URL: mongodb://127.0.0.1:27017/snackmanager_slot_test_ci
        run: pnpm --filter @sm/api exec vitest run src/modules/orders/slot-reservation-race.integration.test.ts

      - name: Compilation
        run: pnpm exec turbo run build $TURBO_FLAGS

      # TypeScript et Vitest peuvent réussir alors qu'un import utilisé par un
      # décorateur arrive trop tard dans le CommonJS émis. Charger le vrai graphe
      # compilé détecte ce défaut AVANT Railway, sans démarrer Nest ni ses bases.
      - name: Chargement du module API compilé
        working-directory: apps/api
        run: |
          node <<'NODE'
          require('reflect-metadata');
          const { AppModule } = require('./dist/app.module.js');
          if (typeof AppModule !== 'function') {
            throw new Error('Le module API compilé doit être chargeable');
          }
          console.log('✓ graphe API CommonJS chargé sans démarrage des services');
          NODE

      - name: Chargement des contrats client compilés sans cycle
        run: node scripts/verify-customer-contracts-built.mjs

name: CI

# ─────────────────────────────────────────────────────────────────────────────
# CE FICHIER EST LA DÉFINITION UNIQUE DE LA VÉRIFICATION.
#
# Il ne l'a pas toujours été : `deploy.yml` en RECOPIAIT les étapes, faute de
# pouvoir conditionner un déploiement sans y toucher. Toute modification faite
# ici devait donc être reportée à la main là-bas, et les deux définitions
# pouvaient diverger SANS QUE RIEN NE LE SIGNALE — on croyait déployer du code
# vérifié par ce fichier alors qu'on le vérifiait avec une copie périmée.
#
# `workflow_call` supprime la copie : `deploy.yml` APPELLE ce fichier
# (`uses: ./.github/workflows/ci.yml`). Une seule définition, une seule chose à
# modifier, plus de dérive possible. Voir docs/CI-CD.md § 13.
# ─────────────────────────────────────────────────────────────────────────────

# Deux déclencheurs, deux rôles :
#   · pull_request → vérifier AVANT de fusionner (c'est ce contrôle que la
#     protection de « main » exige, sous le nom « Vérification du monorepo ») ;
#   · workflow_call → être appelé par `deploy.yml`, sur `develop` comme sur
#     `main`, pour vérifier LE COMMIT QU'ON S'APPRÊTE À METTRE EN LIGNE.
#
# ⚠️ `push: branches: [main]` a été RETIRÉ, et ce n'est pas un oubli.
# `deploy.yml` se déclenche déjà sur ce même push et appelle ce fichier : le
# garder aurait fait tourner la vérification DEUX FOIS sur chaque commit de
# main — deux exécutions du même travail, deux fois le temps, deux fois la
# facture, pour un seul verdict utile. Ce qu'on perdait à le retirer — le
# réchauffage du cache Turborepo de `main`, dont vivent les pull requests — est
# conservé : l'appel depuis `deploy.yml` tourne sur la référence `main`, donc
# `actions/cache` y écrit dans la même portée qu'avant.
#
# ⚠️ Contrepartie à connaître : sur un push vers `main`, la vérification ne
# tourne plus que si `deploy.yml` est présent sur `main`. Les deux fichiers
# voyagent ensemble dans la même fusion — ne les séparez pas. Voir § 13.
on:
  pull_request:
  workflow_call:

# Une PR qu'on repousse trois fois de suite n'a pas besoin de trois CI : on
# annule la précédente.
#
# Appelé par `deploy.yml`, en revanche, on n'annule JAMAIS : `github.event_name`
# vaut alors `push`, et une vérification coupée en cours de route déclarerait en
# échec un déploiement qui n'a rien fait de mal. Le groupe reste distinct de
# celui de `deploy.yml` (`deploiement-…`) : deux groupes identiques entre
# appelant et appelé se bloqueraient mutuellement, pour toujours.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Le cache distant Turborepo est explicitement coupé : rien ne sort du
  # dépôt, et aucun jeton n'est nécessaire. Le cache LOCAL, lui, est restauré
  # d'une exécution à l'autre par actions/cache (étape plus bas).
  TURBO_FLAGS: '--cache=local:rw,remote: --output-logs=new-only'
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verification:
    name: Vérification du monorepo
    runs-on: ubuntu-latest
    # Budget annoncé : moins de dix minutes. Le garde-fou est au-dessus pour
    # laisser voir un dépassement plutôt que de le masquer par un timeout serré.
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer pnpm
        # Aucune version ici : action-setup lit le champ « packageManager » du
        # package.json racine. Une seule source de vérité pour pnpm.
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          # Le package.json racine déclare « engines.node: >=20 », qui est une
          # borne et non une version. On fige 22 (LTS), qui satisfait la borne.
          # Si un .nvmrc apparaît un jour, c'est lui qui doit gagner.
          node-version: 22
          cache: pnpm

      - name: Restaurer le cache Turborepo
        uses: actions/cache@v6
        with:
          # Turborepo 2 range ses artefacts dans .turbo/cache. On ne met en
          # cache que ce dossier : le reste de .turbo (démon, journaux) n'a
          # aucune valeur d'une exécution à l'autre.
          path: .turbo/cache
          # Clé unique par commit — actions/cache n'écrase jamais une clé
          # existante, donc une clé fixe ne serait sauvegardée qu'une fois.
          # Le repli restore-keys récupère le cache de l'exécution précédente.
          key: turbo-${{ runner.os }}-node22-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node22-

      - name: Installer les dépendances
        # --frozen-lockfile : si le lockfile ne correspond plus aux
        # package.json, la CI s'arrête ici au lieu de résoudre en douce des
        # versions différentes de celles du poste de développement.
        run: pnpm install --frozen-lockfile

      # Les quatre vérifications sont des étapes distinctes pour que l'échec
      # soit lisible d'un coup d'œil dans l'interface GitHub. Turborepo ignore
      # silencieusement les paquets qui ne déclarent pas la tâche demandée
      # (@sm/web, @sm/kds, @sm/db et @sm/supply n'ont pas de « test ») : leur
      # absence de script ne fait donc pas échouer la CI.
      - name: Typage
        run: pnpm exec turbo run typecheck $TURBO_FLAGS

      # BLOQUANTE depuis le 22 août 2026. Elle ne l'a pas toujours été :
      # eslint-config-next (Next 16) érige react-hooks/set-state-in-effect en
      # erreur, et apps/web en sortait 45 PRÉEXISTANTES, jamais passées en CI.
      # L'étape a donc tourné en `continue-on-error` le temps de les solder —
      # bloquer dès le premier jour aurait interdit TOUTE fusion, y compris un
      # correctif de production un vendredi soir.
      #
      # La dette est soldée : `turbo run lint` sort en 0 sur les 9 paquets. Le
      # `continue-on-error` et l'étape de signalement qui l'accompagnait sont
      # retirés — une erreur d'analyse statique barre désormais la route, comme
      # le typage et les tests. Voir docs/CI-CD.md § 9.
      - name: Analyse statique
        run: pnpm exec turbo run lint $TURBO_FLAGS

      - name: Tests
        run: pnpm exec turbo run test $TURBO_FLAGS

      - name: Compilation
        run: pnpm exec turbo run build $TURBO_FLAGS

name: Déploiement

# ─────────────────────────────────────────────────────────────────────────────
# Pourquoi ce fichier existe
#
# Les mises en ligne partaient à la main, depuis un poste, avec `railway up`.
# Le 19 août, l'API de staging est restée DEUX HEURES en retard sur la
# production : un correctif déployé d'un côté, oublié de l'autre, et personne
# pour le voir. Un déploiement automatique supprime exactement cette faute-là.
#
#   push sur develop → staging
#   push sur main    → production
#
# Rien ne part sans que la vérification du monorepo ET le balayage des secrets
# soient verts SUR CE COMMIT-LÀ.
#
# Voir docs/CI-CD.md § 10 à 13.
# ─────────────────────────────────────────────────────────────────────────────

# ── Pourquoi `push` et pas `workflow_run` ────────────────────────────────────
# `workflow_run` (« quand la CI a fini, déploie ») paraît le montage évident.
# Il est ici INAPPLICABLE, et dangereux si on l'applique quand même :
#
#   1. RÉDHIBITOIRE — `ci.yml` ne tourne pas tout seul sur un push vers
#      `develop` : ses déclencheurs sont `pull_request` et `workflow_call`.
#      Aucune exécution de CI n'existerait donc pour `develop`, et
#      `workflow_run` n'aurait rien à quoi s'accrocher : staging ne serait
#      JAMAIS déployé.
#   2. `workflow_run` se déclenche pour les exécutions de N'IMPORTE QUELLE
#      branche, y compris une branche de pull request. Sans filtre explicite
#      sur `head_branch` ET sur `event`, du code non relu part en production.
#      C'est le défaut classique, et il est silencieux.
#   3. Dans un `workflow_run`, `github.sha` et `github.ref` désignent la branche
#      PAR DÉFAUT, pas le commit vérifié. Un `actions/checkout` sans argument y
#      récupère `main` — on déploierait donc autre chose que ce qui a été
#      testé. Il faut penser à `github.event.workflow_run.head_sha` partout.
#   4. `workflow_run` n'existe que dans la version du fichier présente sur la
#      branche par défaut : tant que `deploy.yml` n'est pas fusionné dans
#      `main`, rien ne se déclenche — impossible à mettre au point sur develop.
#
# Le montage retenu — vérifier ET déployer dans la MÊME exécution, déclenchée
# par le push — n'a aucun de ces quatre défauts :
#   · `github.sha` EST le commit poussé, par construction ;
#   · `on.push.branches` filtre au niveau du déclencheur : une branche
#     quelconque ne crée même pas d'exécution ;
#   · le graphe `needs:` rend le déploiement structurellement inatteignable
#     tant que la vérification ou le balayage est rouge.
#
# `workflow_call` (§ 2 ci-dessous) lui enlève son dernier défaut : la
# vérification n'est plus recopiée ici, elle est APPELÉE. Une seule définition.

on:
  push:
    branches: [main, develop]

# Deux poussées coup sur coup ne doivent pas se doubler sur Railway.
# `cancel-in-progress: false` est VOLONTAIRE : on ne coupe jamais un
# déploiement en vol. Annuler le job GitHub n'annulerait de toute façon pas le
# déploiement Railway déjà lancé — on aurait juste perdu les journaux, et une
# migration pourrait être en cours. On fait la queue.
concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Plus aucun réglage Turborepo ici : la vérification ne s'exécute plus dans ce
  # fichier, elle est appelée (§ 2). Ses réglages vivent dans `ci.yml`, et un
  # `env:` d'appelant ne traverse de toute façon PAS vers un workflow appelé —
  # les laisser aurait été du décor trompeur.
  #
  # Version figée, même raison que gitleaks dans secrets.yml : un outil de
  # déploiement qui change de comportement tout seul n'est pas un outil de
  # déploiement. À relever volontairement.
  VERSION_RAILWAY: 5.47.1
  SHA256_RAILWAY: bf8e79049a8a51095006ee60a7f0697855fed3521a8bfedf5906a96b4e3a2f78

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1 · La cible
  #
  # Un seul endroit décide « quelle branche va où ». Tout le reste en dépend
  # (`needs: cible`), donc si cette correspondance refuse de trancher, RIEN ne
  # se déploie. C'est la définition de « fermé par défaut ».
  # ───────────────────────────────────────────────────────────────────────────
  cible:
    name: Cible du déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Un fork n'a pas nos secrets, mais il n'a pas non plus à essayer.
    if: github.repository == 'GLWebDevAgency/snack-manager'
    outputs:
      environnement: ${{ steps.resoudre.outputs.environnement }}
    steps:
      - name: Résoudre la branche en environnement
        id: resoudre
        # `github.ref` passe par l'environnement et jamais par interpolation
        # directe dans le script : une référence n'est pas du code shell.
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main)    environnement=production ;;
            refs/heads/develop) environnement=staging ;;
            *)
              echo "::error title=Branche non déployable::« $REF » ne correspond à aucun environnement. Rien ne part."
              exit 1
              ;;
          esac
          echo "environnement=$environnement" >> "$GITHUB_OUTPUT"
          {
            echo "## Déploiement — \`$environnement\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branche | \`${REF#refs/heads/}\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| Environnement Railway | **$environnement** |"
            echo "| Services | \`api\` (migrations), puis \`web\`, \`pos\`, \`kds\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "→ $environnement (branche ${REF#refs/heads/}, commit $SHA)"

  # ───────────────────────────────────────────────────────────────────────────
  # 2 · Les deux garde-fous, sur CE commit
  #
  # CES DEUX JOBS N'ONT PLUS D'ÉTAPES, ET C'EST TOUT L'INTÉRÊT.
  #
  # Ils recopiaient `ci.yml` et `secrets.yml`, faute de pouvoir les conditionner
  # autrement. Le prix était une DÉRIVE SILENCIEUSE : une étape ajoutée là-bas
  # et oubliée ici, et l'on déployait en croyant avoir vérifié. Rien ne l'aurait
  # signalé — ni erreur, ni avertissement, juste deux fichiers qui ne disent plus
  # la même chose.
  #
  # `uses:` supprime la copie. Ce qui tourne ici EST le fichier de la CI, à la
  # ligne près, y compris son `timeout-minutes` et ses versions d'actions —
  # d'où l'absence de `runs-on` et de `timeout-minutes` ci-dessous, que GitHub
  # refuse d'ailleurs sur un job qui en appelle un autre.
  #
  # Deux choses à savoir, et elles sont volontaires :
  #   · AUCUN `secrets:` n'est passé. Un workflow appelé n'hérite de rien
  #     (hormis GITHUB_TOKEN) tant qu'on ne l'a pas écrit. La vérification et le
  #     balayage n'ont donc, structurellement, aucun accès aux jetons Railway.
  #   · `permissions:` est déclaré ICI parce qu'il plafonne ce que le workflow
  #     appelé pourra obtenir : `pull-requests: read` est indispensable à
  #     `gitleaks-action`, qui interroge l'API pour délimiter la plage à
  #     balayer. Sans cette ligne : 403, et le balayage tombe avant de balayer.
  #
  # Voir docs/CI-CD.md § 13.
  # ───────────────────────────────────────────────────────────────────────────
  verification:
    needs: cible
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  secrets:
    needs: cible
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/secrets.yml

  # La base ne doit subir aucun DDL avant d'avoir prouvé que le jeton cible le
  # bon projet Railway et que l'API possède le garde de schéma en lecture seule.
  preflight_railway:
    name: Préflight Railway sans mutation
    needs: [cible, verification, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: >-
        ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN_PRODUCTION
        || github.ref == 'refs/heads/develop' && secrets.RAILWAY_TOKEN_STAGING
        || '' }}
      ENVIRONNEMENT: ${{ needs.cible.outputs.environnement }}
      DELIVERY_HANDOFF_KEY: >-
        ${{ github.ref == 'refs/heads/main' && secrets.SM_DELIVERY_HANDOFF_KEY_PRODUCTION
        || github.ref == 'refs/heads/develop' && secrets.SM_DELIVERY_HANDOFF_KEY_STAGING
        || '' }}
      CONTACT_INGEST_TOKEN: >-
        ${{ github.ref == 'refs/heads/main' && secrets.SM_CONTACT_INGEST_TOKEN_PRODUCTION
        || github.ref == 'refs/heads/develop' && secrets.SM_CONTACT_INGEST_TOKEN_STAGING
        || '' }}
      TURNSTILE_SECRET: >-
        ${{ github.ref == 'refs/heads/main' && secrets.SM_TURNSTILE_SECRET_KEY_PRODUCTION
        || github.ref == 'refs/heads/develop' && secrets.SM_TURNSTILE_SECRET_KEY_STAGING
        || '' }}
      TURNSTILE_SITE_KEY: >-
        ${{ github.ref == 'refs/heads/main' && vars.SM_TURNSTILE_SITE_KEY_PRODUCTION
        || github.ref == 'refs/heads/develop' && vars.SM_TURNSTILE_SITE_KEY_STAGING
        || '' }}
      TURNSTILE_OTHER_SITE_KEY: >-
        ${{ github.ref == 'refs/heads/main' && vars.SM_TURNSTILE_SITE_KEY_STAGING
        || github.ref == 'refs/heads/develop' && vars.SM_TURNSTILE_SITE_KEY_PRODUCTION
        || '' }}
      TURNSTILE_ALLOWED_HOSTS: >-
        ${{ github.ref == 'refs/heads/main' && vars.SM_TURNSTILE_ALLOWED_HOSTNAMES_PRODUCTION
        || github.ref == 'refs/heads/develop' && vars.SM_TURNSTILE_ALLOWED_HOSTNAMES_STAGING
        || '' }}
    steps:
      - name: Vérifier la clé de remise avant toute migration
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.DELIVERY_HANDOFF_KEY ?? '';
          const decoded = Buffer.from(raw, 'base64url');
          if (!/^[A-Za-z0-9_-]{43}$/.test(raw) || decoded.length !== 32 || decoded.toString('base64url') !== raw) {
            throw new Error('Clé de remise absente ou invalide pour cet environnement. Aucune migration ni livraison.');
          }
          NODE

      - name: Installer la CLI Railway vérifiée
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway.tar.gz"
          curl -sSfL \
            "https://github.com/railwayapp/cli/releases/download/v${VERSION_RAILWAY}/railway-v${VERSION_RAILWAY}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$SHA256_RAILWAY" "$archive" | sha256sum --check --status
          sudo tar -xzf "$archive" -C /usr/local/bin railway

      - name: Vérifier cible, services et garde de schéma
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error title=Aucun jeton Railway::$ENVIRONNEMENT n'a pas de jeton associé. Rien ne part."
            exit 1
          fi
          for service in api web pos kds; do
            if ! railway deployment list --environment "$ENVIRONNEMENT" --service "$service" --limit 1 --json >/dev/null 2>&1; then
              echo "::error title=Jeton Railway inutilisable::service « $service » inaccessible. Rien ne part."
              exit 1
            fi
          done
          if ! api_service_id="$(
            railway service list --environment "$ENVIRONNEMENT" --json 2>/dev/null |
              jq -er '[.[] | select(.name == "api")] | if length == 1 then .[0].id else error("api cardinality") end'
          )"; then
            echo "::error title=Configuration Railway illisible::service api non résolu exactement. Rien ne part."
            exit 1
          fi
          if ! railway environment config --environment "$ENVIRONNEMENT" --json 2>/dev/null |
            jq -e --arg id "$api_service_id" '
              .services[$id].deploy.preDeployCommand
              | if type == "string" then [.] elif type == "array" then . else [] end
              | . == ["pnpm verify:postgres:built"]
            ' >/dev/null 2>&1; then
            echo "::error title=Schéma PostgreSQL non verrouillé::preDeployCommand api incorrect. Aucune migration ne part."
            exit 1
          fi
          echo "✓ préflight Railway $ENVIRONNEMENT validé sans mutation"

      - name: Vérifier contact et protection anti-robot
        run: |
          set -euo pipefail
          node <<'NODE'
          const contactTokenRaw = process.env.CONTACT_INGEST_TOKEN ?? '';
          const turnstileSecretRaw = process.env.TURNSTILE_SECRET ?? '';
          const turnstileSiteKeyRaw = process.env.TURNSTILE_SITE_KEY ?? '';
          const otherTurnstileSiteKeyRaw = process.env.TURNSTILE_OTHER_SITE_KEY ?? '';
          const contactToken = contactTokenRaw.trim();
          const turnstileSecret = turnstileSecretRaw.trim();
          const turnstileSiteKey = turnstileSiteKeyRaw.trim();
          const otherTurnstileSiteKey = otherTurnstileSiteKeyRaw.trim();
          const allowedHosts = (process.env.TURNSTILE_ALLOWED_HOSTS ?? '')
            .split(',')
            .map((host) => host.trim().toLowerCase())
            .filter(Boolean);
          const expectedRoot =
            process.env.ENVIRONNEMENT === 'staging'
              ? 'staging.snackmanager.fr'
              : process.env.ENVIRONNEMENT === 'production'
                ? 'snackmanager.fr'
                : '';

          if (
            contactTokenRaw !== contactToken ||
            Buffer.byteLength(contactToken, 'utf8') < 32 ||
            /\s/.test(contactToken)
          ) {
            throw new Error('SM_CONTACT_INGEST_TOKEN_* doit contenir au moins 32 octets sans espace');
          }
          for (const [name, raw, value] of [
            ['SM_TURNSTILE_SECRET_KEY_*', turnstileSecretRaw, turnstileSecret],
            ['SM_TURNSTILE_SITE_KEY_*', turnstileSiteKeyRaw, turnstileSiteKey],
          ]) {
            if (raw !== value || value.length < 20 || /\s/.test(value)) {
              throw new Error(`${name} est absent ou invalide`);
            }
          }
          const testSiteKeys = new Set([
            '1x00000000000000000000AA',
            '2x00000000000000000000AB',
            '1x00000000000000000000BB',
            '2x00000000000000000000BB',
            '3x00000000000000000000FF',
          ]);
          const testSecretKeys = new Set([
            '1x0000000000000000000000000000000AA',
            '2x0000000000000000000000000000000AA',
            '3x0000000000000000000000000000000AA',
          ]);
          if (testSiteKeys.has(turnstileSiteKey) || testSecretKeys.has(turnstileSecret)) {
            throw new Error('Les clés de test Turnstile sont interdites sur Railway');
          }
          if (otherTurnstileSiteKey && otherTurnstileSiteKey === turnstileSiteKey) {
            throw new Error('Les widgets Turnstile staging et production doivent être distincts');
          }
          if (new Set([contactToken, turnstileSecret, turnstileSiteKey]).size !== 3) {
            throw new Error('Les identités contact et Turnstile doivent être indépendantes');
          }
          if (!expectedRoot || !allowedHosts.includes(expectedRoot)) {
            throw new Error(`TURNSTILE_ALLOWED_HOSTNAMES doit contenir ${expectedRoot || 'la racine attendue'}`);
          }
          if (
            new Set(allowedHosts).size !== allowedHosts.length ||
            allowedHosts.some(
              (host) =>
                host.includes('*') ||
                host.includes('://') ||
                host.includes('/') ||
                host.includes(':') ||
                !/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$/.test(host),
            )
          ) {
            throw new Error('TURNSTILE_ALLOWED_HOSTNAMES contient un hôte invalide ou dupliqué');
          }
          NODE
          echo "✓ contact et Turnstile configurés pour $ENVIRONNEMENT"

  # ───────────────────────────────────────────────────────────────────────────
  # 3 · Les migrations privilégiées, hors du conteneur applicatif
  #
  # Railway expose les variables d'un service au preDeploy ET au processus en
  # service. Y placer le compte DDL donnerait donc à l'API une voie de
  # contournement de son rôle RLS. Ce job garde l'identité de migration dans
  # GitHub Secrets, applique les migrations, puis disparaît avec son runner.
  # ───────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migrations PostgreSQL privilégiées
    needs: [cible, verification, secrets, preflight_railway]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler les migrateurs
        run: |
          pnpm --filter @sm/postgres-bootstrap build
          pnpm --filter @sm/supply build
          pnpm --filter @sm/loyalty build
          pnpm --filter @sm/customer build

      - name: Préparer la connexion DDL authentifiée
        env:
          DATABASE_MIGRATION_URL_RAW: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_DATABASE_MIGRATION_URL_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_DATABASE_MIGRATION_URL_PRODUCTION
            || '' }}
          DATABASE_MIGRATION_ROOT_CA_B64: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_DATABASE_ROOT_CA_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_DATABASE_ROOT_CA_PRODUCTION
            || '' }}
          DATABASE_MIGRATION_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_migrator'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_migrator'
            || '' }}
          DATABASE_RUNTIME_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_app'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_app'
            || '' }}
          EXPECTED_MIGRATION_HOST: >-
            ${{ github.ref == 'refs/heads/develop' && 'zephyr.proxy.rlwy.net'
            || github.ref == 'refs/heads/main' && vars.SM_DATABASE_MIGRATION_HOST_PRODUCTION
            || '' }}
          EXPECTED_MIGRATION_PORT: >-
            ${{ github.ref == 'refs/heads/develop' && '34641'
            || github.ref == 'refs/heads/main' && vars.SM_DATABASE_MIGRATION_PORT_PRODUCTION
            || '' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { X509Certificate } = require('node:crypto');
          const { appendFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');

          const role = process.env.DATABASE_RUNTIME_ROLE?.trim() ?? '';
          if (!/^[a-z][a-z0-9_]{2,62}$/.test(role)) {
            throw new Error('DATABASE_RUNTIME_ROLE invalide');
          }
          const migrationRole = process.env.DATABASE_MIGRATION_ROLE?.trim() ?? '';
          if (!/^[a-z][a-z0-9_]{2,62}$/.test(migrationRole) || migrationRole === role) {
            throw new Error('DATABASE_MIGRATION_ROLE invalide');
          }
          let migration;
          try {
            migration = new URL(process.env.DATABASE_MIGRATION_URL_RAW ?? '');
          } catch {
            throw new Error('SM_DATABASE_MIGRATION_URL_* doit être une URL PostgreSQL valide');
          }
          if (
            !['postgres:', 'postgresql:'].includes(migration.protocol) ||
            !migration.username ||
            !migration.password ||
            !migration.hostname ||
            migration.pathname.length <= 1
          ) {
            throw new Error('SM_DATABASE_MIGRATION_URL_* doit être une URL PostgreSQL complète');
          }
          if ([...migration.searchParams].length !== 0) {
            throw new Error('L URL de migration brute ne doit contenir aucun paramètre');
          }
          if (migration.hostname.endsWith('.railway.internal')) {
            throw new Error('L URL de migration doit être joignable depuis le runner GitHub');
          }
          if (
            migration.hostname !== process.env.EXPECTED_MIGRATION_HOST ||
            migration.port !== process.env.EXPECTED_MIGRATION_PORT ||
            decodeURIComponent(migration.pathname) !== '/railway'
          ) {
            throw new Error('L URL de migration ne cible pas la base autorisée pour cette branche');
          }
          if (decodeURIComponent(migration.username) !== migrationRole) {
            throw new Error('L URL DDL doit utiliser exactement le rôle de migration dédié');
          }

          const encodedCa = process.env.DATABASE_MIGRATION_ROOT_CA_B64?.trim() ?? '';
          const ca = Buffer.from(encodedCa, 'base64');
          if (ca.length === 0 || ca.toString('base64') !== encodedCa) {
            throw new Error('SM_DATABASE_ROOT_CA_* doit être un certificat base64 canonique');
          }
          let certificate;
          try {
            certificate = new X509Certificate(ca);
          } catch {
            throw new Error('SM_DATABASE_ROOT_CA_* ne contient pas un certificat X.509');
          }
          if (!certificate.ca) {
            throw new Error('SM_DATABASE_ROOT_CA_* ne contient pas une autorité de certification');
          }

          const caPath = join(process.env.RUNNER_TEMP, 'postgres-migration-root-ca.pem');
          writeFileSync(caPath, ca, { mode: 0o600 });
          migration.searchParams.set('sslmode', 'verify-ca');
          migration.searchParams.set('uselibpqcompat', 'true');
          migration.searchParams.set('sslrootcert', caPath);
          const securedUrl = migration.toString();
          process.stdout.write(`::add-mask::${securedUrl}\n`);
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_MIGRATION_URL=${securedUrl}\n`);
          NODE

      - name: Vérifier le bootstrap PostgreSQL en lecture seule
        env:
          NODE_ENV: production
          DATABASE_MIGRATION_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_migrator'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_migrator'
            || '' }}
          DATABASE_RUNTIME_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_app'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_app'
            || '' }}
        run: pnpm postgres:bootstrap:check:built

      - name: Appliquer supply, fidélité puis identité client
        env:
          NODE_ENV: production
          DATABASE_RUNTIME_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_app'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_app'
            || '' }}
        run: |
          set -euo pipefail
          pnpm migrate:postgres:built

      - name: Confirmer le bootstrap après migration
        env:
          NODE_ENV: production
          DATABASE_MIGRATION_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_migrator'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_migrator'
            || '' }}
          DATABASE_RUNTIME_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_app'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_app'
            || '' }}
        run: pnpm postgres:bootstrap:check:built

  # ───────────────────────────────────────────────────────────────────────────
  # 4 · Le déploiement
  #
  # `needs` porte toute la garantie : ce job n'existe pas tant que les deux
  # précédents ne sont pas verts. Un échec de la vérification ou du balayage ne
  # « saute » pas ce job, il le rend inatteignable.
  # ───────────────────────────────────────────────────────────────────────────
  deploiement:
    name: Mise en ligne des quatre services
    needs: [cible, verification, secrets, preflight_railway, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # LE JETON ET L'ENVIRONNEMENT EXPLICITE FORMENT LA FRONTIÈRE.
      #
      # Chaque commande reçoit aussi `--environment` : un secret GitHub mal
      # câblé est ainsi refusé au lieu de publier des clés staging ailleurs.
      #
      # La garde est écrite sur la même ligne que le nom du secret, pour
      # qu'un `grep RAILWAY_TOKEN_PRODUCTION` montre immédiatement à quelle
      # branche il est attaché. Si la référence n'est ni main ni develop, le
      # jeton vaut la chaîne vide et railway refuse de démarrer — fermé par
      # défaut, une troisième fois.
      RAILWAY_TOKEN: >-
        ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN_PRODUCTION
        || github.ref == 'refs/heads/develop' && secrets.RAILWAY_TOKEN_STAGING
        || '' }}
      ENVIRONNEMENT: ${{ needs.cible.outputs.environnement }}
    steps:
      # Aucun `pnpm install` ici : `railway up` téléverse l'arbre tel quel et
      # c'est Railway qui construit (`pnpm turbo build --filter=@sm/<app>`).
      # Un arbre sans node_modules, c'est un téléversement court et un
      # déploiement qui ne dépend pas de ce que le runner a installé.
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer la CLI Railway
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/railway.tar.gz"
          curl -sSfL \
            "https://github.com/railwayapp/cli/releases/download/v${VERSION_RAILWAY}/railway-v${VERSION_RAILWAY}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$SHA256_RAILWAY" "$archive" | sha256sum --check --status
          sudo tar -xzf "$archive" -C /usr/local/bin railway
          railway --version

      # Contrôle préalable : le jeton existe, il ouvre bien les quatre services,
      # et on note l'état AVANT — c'est cet identifiant que l'attente comparera
      # pour savoir si le nouveau déploiement est apparu.
      - name: Vérifier le jeton et relever l'état avant
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error title=Aucun jeton Railway::« ${GITHUB_REF} » n'a pas de jeton associé. Rien ne part."
            exit 1
          fi
          echo "Environnement visé : ${ENVIRONNEMENT}"
          for service in api web pos kds; do
            if ! sortie="$(railway deployment list --environment "$ENVIRONNEMENT" --service "$service" --limit 1 --json 2>&1)"; then
              echo "::error title=Jeton Railway inutilisable::service « $service » : $sortie"
              exit 1
            fi
            printf '  %-4s → en tête : %s (%s)\n' "$service" \
              "$(printf '%s' "$sortie" | jq -r '.[0].id // "aucun"')" \
              "$(printf '%s' "$sortie" | jq -r '.[0].status // "—"')"
          done

      # Ce réglage vit chez Railway et non dans l'arbre du monorepo. On le lit
      # avant TOUTE mutation : une ancienne commande « supply seulement »
      # laisserait les routes fidélité parler à un schéma absent. La sortie de
      # `environment config` est toujours masquée car Railway y inclut aussi
      # les variables déchiffrées du projet.
      - name: Vérifier la migration PostgreSQL pré-déploiement
        run: |
          set -euo pipefail
          expected='pnpm verify:postgres:built'
          if ! api_service_id="$(
            railway service list --environment "$ENVIRONNEMENT" --json 2>/dev/null |
              jq -er '[.[] | select(.name == "api")] | if length == 1 then .[0].id else error("api cardinality") end'
          )"; then
            echo "::error title=Configuration Railway illisible::impossible de résoudre exactement le service api. Rien ne part."
            exit 1
          fi

          if ! railway environment config --environment "$ENVIRONNEMENT" --json 2>/dev/null |
            jq -e --arg id "$api_service_id" --arg expected "$expected" '
              .services[$id].deploy.preDeployCommand
              | if type == "string" then [.] elif type == "array" then . else [] end
              | . == [$expected]
            ' >/dev/null 2>&1; then
            echo "::error title=Schéma PostgreSQL non verrouillé::le preDeployCommand api n'est pas exactement pnpm verify:postgres:built. Rien ne part."
            exit 1
          fi
          echo '✓ preDeployCommand api vérifié (journaux supply, fidélité et identité client)'

      # Les clés sont gardées dans GitHub Secrets, séparées par environnement,
      # puis copiées vers Railway juste avant le build. Aucune valeur ni aucune
      # sortie de `railway variables` n'arrive dans les journaux.
      - name: Vérifier et publier les secrets fidélité
        env:
          DELIVERY_HANDOFF_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_DELIVERY_HANDOFF_KEY_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_DELIVERY_HANDOFF_KEY_PRODUCTION
            || '' }}
          DATABASE_RUNTIME_URL: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_DATABASE_URL_RUNTIME_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_DATABASE_URL_RUNTIME_PRODUCTION
            || '' }}
          DATABASE_RUNTIME_ROLE: >-
            ${{ github.ref == 'refs/heads/develop' && 'snackmanager_staging_app'
            || github.ref == 'refs/heads/main' && 'snackmanager_production_app'
            || '' }}
          LOYALTY_PROFILE_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_LOYALTY_PROFILE_ENCRYPTION_KEY_V1_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_LOYALTY_PROFILE_ENCRYPTION_KEY_V1_PRODUCTION
            || '' }}
          LOYALTY_PHONE_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_LOYALTY_PHONE_LOOKUP_KEY_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_LOYALTY_PHONE_LOOKUP_KEY_PRODUCTION
            || '' }}
          LOYALTY_OPERATION_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_LOYALTY_OPERATION_FINGERPRINT_KEY_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_LOYALTY_OPERATION_FINGERPRINT_KEY_PRODUCTION
            || '' }}
          LOYALTY_QR_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_LOYALTY_QR_DERIVATION_KEY_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_LOYALTY_QR_DERIVATION_KEY_PRODUCTION
            || '' }}
          PUBLIC_RELAY_KEY: >-
            ${{ github.ref == 'refs/heads/develop' && secrets.SM_PUBLIC_RELAY_SIGNING_KEY_STAGING
            || github.ref == 'refs/heads/main' && secrets.SM_PUBLIC_RELAY_SIGNING_KEY_PRODUCTION
            || '' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const keyNames = [
            'LOYALTY_PROFILE_KEY',
            'LOYALTY_PHONE_KEY',
            'LOYALTY_OPERATION_KEY',
            'LOYALTY_QR_KEY',
            'PUBLIC_RELAY_KEY',
          ];
          const decoded = keyNames.map((name) => {
            const raw = process.env[name]?.trim() ?? '';
            const value = Buffer.from(raw, 'base64');
            if (value.length !== 32 || value.toString('base64') !== raw) {
              throw new Error(`${name} doit être une clé base64 canonique de 32 octets`);
            }
            return raw;
          });
          if (new Set(decoded).size !== decoded.length) {
            throw new Error('Les clés fidélité et relais doivent être indépendantes');
          }
          const handoffRaw = process.env.DELIVERY_HANDOFF_KEY ?? '';
          const handoffKey = Buffer.from(handoffRaw, 'base64url');
          if (!/^[A-Za-z0-9_-]{43}$/.test(handoffRaw) || handoffKey.length !== 32 || handoffKey.toString('base64url') !== handoffRaw) {
            throw new Error('La clé de remise doit contenir 32 octets en base64url canonique');
          }
          if (decoded.some(value => Buffer.from(value, 'base64').equals(handoffKey))) {
            throw new Error('La clé de remise doit être indépendante des clés fidélité et relais');
          }

          let runtime;
          try {
            runtime = new URL(process.env.DATABASE_RUNTIME_URL ?? '');
          } catch {
            throw new Error('SM_DATABASE_URL_RUNTIME_* doit être une URL PostgreSQL valide');
          }
          const role = process.env.DATABASE_RUNTIME_ROLE?.trim() ?? '';
          if (
            !['postgres:', 'postgresql:'].includes(runtime.protocol) ||
            !runtime.username ||
            !runtime.password ||
            !runtime.hostname ||
            runtime.pathname.length <= 1
          ) {
            throw new Error('URL PostgreSQL runtime invalide');
          }
          const forbiddenIdentityParameters = ['user', 'password', 'host', 'port', 'dbname', 'database', 'options', 'service'];
          if (forbiddenIdentityParameters.some((name) => runtime.searchParams.has(name))) {
            throw new Error('L URL runtime contient un paramètre d identité interdit');
          }
          if (
            runtime.hostname !== 'postgres.railway.internal' ||
            runtime.port !== '5432' ||
            decodeURIComponent(runtime.pathname) !== '/railway'
          ) {
            throw new Error('DATABASE_URL runtime doit utiliser la base PostgreSQL privée Railway');
          }
          if (!/^[a-z][a-z0-9_]{2,62}$/.test(role)) {
            throw new Error('DATABASE_RUNTIME_ROLE invalide');
          }
          if (decodeURIComponent(runtime.username) !== role) {
            throw new Error('DATABASE_URL doit utiliser exactement DATABASE_RUNTIME_ROLE');
          }
          NODE

          if ! railway variables --environment "$ENVIRONNEMENT" --service api --skip-deploys \
               --set "DATABASE_URL=$DATABASE_RUNTIME_URL" \
               --set 'DATABASE_MIGRATION_URL=' \
               --set "DATABASE_RUNTIME_ROLE=$DATABASE_RUNTIME_ROLE" \
               --set "LOYALTY_PROFILE_ENCRYPTION_KEY_V1=$LOYALTY_PROFILE_KEY" \
               --set 'LOYALTY_PROFILE_KEY_VERSION=1' \
               --set "LOYALTY_PHONE_LOOKUP_KEY=$LOYALTY_PHONE_KEY" \
               --set "LOYALTY_OPERATION_FINGERPRINT_KEY=$LOYALTY_OPERATION_KEY" \
               --set "LOYALTY_QR_DERIVATION_KEY=$LOYALTY_QR_KEY" \
               --set "SM_PUBLIC_RELAY_SIGNING_KEY=$PUBLIC_RELAY_KEY" \
               --set "DELIVERY_HANDOFF_KEY=$DELIVERY_HANDOFF_KEY" \
               --set 'SM_PG_POOL_MAX=10' \
               > "$RUNNER_TEMP/variables-api-fidelite.log" 2>&1; then
            echo "::error title=Secrets fidélité non publiés::service api (sortie masquée). Rien ne part."
            exit 1
          fi

          if ! railway variables --environment "$ENVIRONNEMENT" --service web --skip-deploys \
               --set "SM_PUBLIC_RELAY_SIGNING_KEY=$PUBLIC_RELAY_KEY" \
               > "$RUNNER_TEMP/variables-web-fidelite.log" 2>&1; then
            echo "::error title=Clé relais non publiée::service web (sortie masquée). Rien ne part."
            exit 1
          fi
          echo "✓ secrets fidélité publiés sur api et web ($ENVIRONNEMENT)"

      # Le formulaire public passe par le serveur Next, jamais directement par
      # l'ingestion CRM. La commande publique, elle, doit présenter une preuve
      # Turnstile liée au tenant et à l'hôte. Les deux paires sont distinctes
      # entre staging et production et sont validées au préflight, avant le DDL.
      - name: Publier contact et protection anti-robot
        env:
          CONTACT_INGEST_TOKEN: >-
            ${{ github.ref == 'refs/heads/main' && secrets.SM_CONTACT_INGEST_TOKEN_PRODUCTION
            || github.ref == 'refs/heads/develop' && secrets.SM_CONTACT_INGEST_TOKEN_STAGING
            || '' }}
          TURNSTILE_SECRET: >-
            ${{ github.ref == 'refs/heads/main' && secrets.SM_TURNSTILE_SECRET_KEY_PRODUCTION
            || github.ref == 'refs/heads/develop' && secrets.SM_TURNSTILE_SECRET_KEY_STAGING
            || '' }}
          TURNSTILE_SITE_KEY: >-
            ${{ github.ref == 'refs/heads/main' && vars.SM_TURNSTILE_SITE_KEY_PRODUCTION
            || github.ref == 'refs/heads/develop' && vars.SM_TURNSTILE_SITE_KEY_STAGING
            || '' }}
          TURNSTILE_ALLOWED_HOSTS: >-
            ${{ github.ref == 'refs/heads/main' && vars.SM_TURNSTILE_ALLOWED_HOSTNAMES_PRODUCTION
            || github.ref == 'refs/heads/develop' && vars.SM_TURNSTILE_ALLOWED_HOSTNAMES_STAGING
            || '' }}
        run: |
          set -euo pipefail
          if ! railway variables --environment "$ENVIRONNEMENT" --service api --skip-deploys \
               --set "SM_CONTACT_INGEST_TOKEN=$CONTACT_INGEST_TOKEN" \
               --set "TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET" \
               --set "TURNSTILE_ALLOWED_HOSTNAMES=$TURNSTILE_ALLOWED_HOSTS" \
               > "$RUNNER_TEMP/variables-api-public.log" 2>&1; then
            echo "::error title=Configuration publique non publiée::service api (sortie masquée). Rien ne part."
            exit 1
          fi

          if ! railway variables --environment "$ENVIRONNEMENT" --service web --skip-deploys \
               --set "SM_CONTACT_INGEST_TOKEN=$CONTACT_INGEST_TOKEN" \
               --set 'API_URL=http://api.railway.internal:3001' \
               --set "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY" \
               > "$RUNNER_TEMP/variables-web-public.log" 2>&1; then
            echo "::error title=Configuration publique non publiée::service web (sortie masquée). Rien ne part."
            exit 1
          fi
          echo "✓ contact et Turnstile publiés sur api et web ($ENVIRONNEMENT)"

      # Les deux apps terrain embarquent leurs origines au BUILD. Elles ne
      # doivent jamais hériter d'une valeur laissée par un autre environnement :
      # une caisse de staging qui appelle la production y enverrait jetons,
      # ventes et fidélité. La branche décide ici de la PAIRE API/Web, en un
      # seul endroit, puis les deux services reçoivent exactement la même.
      - name: Verrouiller les origines des surfaces terrain
        run: |
          set -euo pipefail
          case "$ENVIRONNEMENT" in
            staging)
              api_origin='https://api-staging-a5e8.up.railway.app'
              site_origin='https://web-staging-6f5f.up.railway.app'
              ;;
            production)
              api_origin='https://api-production-8949.up.railway.app'
              site_origin='https://web-production-99b58c.up.railway.app'
              ;;
            *)
              echo "::error title=Environnement terrain inconnu::« $ENVIRONNEMENT » n'a aucune paire d'origines autorisée."
              exit 1
              ;;
          esac

          for service in pos kds; do
            if ! railway variables --environment "$ENVIRONNEMENT" --service "$service" --skip-deploys \
                 --set "EXPO_PUBLIC_API_URL=$api_origin" \
                 --set "EXPO_PUBLIC_SITE_URL=$site_origin" \
                 --set 'EXPO_PUBLIC_ALLOW_LOCAL_API=0' \
                 > "$RUNNER_TEMP/variables-$service.log" 2>&1; then
              echo "::error title=Origines non publiées::service « $service » (sortie masquée : elle contient les variables du service). Rien ne part."
              exit 1
            fi
            echo "✓ $service configuré pour $ENVIRONNEMENT"
          done

      # ── Dire au conteneur quelle révision il sert ─────────────────────────
      #
      # Railway ne le sait pas tout seul. La famille `RAILWAY_GIT_*` n'est
      # renseignée que pour un service branché sur un dépôt GitHub ; ici on
      # téléverse avec `railway up`, et le relevé du 20 août 2026 dans le
      # conteneur `api` de staging est net : pas de `RAILWAY_GIT_COMMIT_SHA`,
      # et `RAILWAY_GIT_REPO_OWNER` présente mais VIDE. Lire cette variable
      # aurait donné une route qui répond « inconnue » pour toujours.
      #
      # On pose donc nous-mêmes la valeur, juste AVANT le téléversement :
      # `--skip-deploys` évite de déclencher un déploiement supplémentaire
      # (qui repartirait de l'ancien code, et que l'attente plus bas prendrait
      # pour le nôtre), et le déploiement créé à l'étape suivante la sert.
      #
      # Si la mise en ligne échoue ensuite, le conteneur en service garde son
      # ancien environnement : `/health` continue d'annoncer l'ANCIENNE
      # révision — exactement ce qu'on veut lire dans ce cas-là.
      #
      # ⚠️ La sortie est écartée en totalité, y compris en cas d'échec :
      # `railway variables` réaffiche TOUTES les variables du service, mots de
      # passe compris. Un journal d'exécution ne doit pas devenir le deuxième
      # endroit d'où un secret fuite.
      - name: Publier la révision déployée sur le service api
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! railway variables --environment "$ENVIRONNEMENT" --service api --skip-deploys --set "SM_REVISION=$SHA" \
               > "$RUNNER_TEMP/variables.log" 2>&1; then
            echo "::error title=Révision non publiée::railway variables a échoué (sortie masquée : elle contient les variables du service). Rien ne part."
            exit 1
          fi
          echo "SM_REVISION posée sur « api » → $SHA"
          echo "Le déploiement créé à l'étape suivante la servira sur GET /health."

      # La procédure de déploiement est écrite une fois, dans un fichier, puis
      # sourcée par les deux étapes qui suivent — plutôt que recopiée.
      - name: Préparer la procédure de déploiement
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/deployer.sh" <<'SCRIPT'
          # Identifiant du déploiement actuellement en tête pour un service.
          derniere_id() {
            railway deployment list --environment "$ENVIRONNEMENT" --service "$1" --limit 1 --json 2>/dev/null \
              | jq -r '.[0].id // "aucun"'
          }

          # Téléverse, puis ATTEND l'état terminal du NOUVEAU déploiement.
          #
          # `railway up` rend la main à la fin de la CONSTRUCTION (GitHub Actions
          # pose CI=true, la CLI se met d'elle-même en mode « --ci »). Sans cette
          # attente, un échec de migration ou de démarrage passerait pour un
          # succès : le job serait vert et le restaurant en panne.
          deployer() {
            service="$1"
            avant="$(derniere_id "$service")"
            echo "▶ $service — déploiement en tête avant : $avant"

            # On ne s'arrête pas sur le code de sortie de `railway up` : c'est
            # l'état du déploiement chez Railway qui fait foi, et lui seul sait
            # si la migration puis le contrôle de santé sont passés.
            if ! railway up --environment "$ENVIRONNEMENT" --service "$service" --ci; then
              echo "::warning title=$service::railway up a rendu un code non nul — on interroge l'état du déploiement."
            fi

            sans_nouveau=0
            for _ in $(seq 1 240); do
              ligne="$(railway deployment list --environment "$ENVIRONNEMENT" --service "$service" --limit 1 --json 2>/dev/null || echo '[]')"
              id="$(printf '%s' "$ligne" | jq -r '.[0].id // "aucun"')"
              statut="$(printf '%s' "$ligne" | jq -r '.[0].status // "INCONNU"')"

              # Tant que la tête n'a pas changé, le nouveau déploiement n'est
              # pas encore enregistré : on ne conclut pas sur l'ancien. Mais on
              # ne l'attend pas vingt minutes non plus — s'il n'apparaît pas en
              # deux minutes, c'est que le téléversement n'a rien créé.
              if [ "$id" = "$avant" ]; then
                sans_nouveau=$((sans_nouveau + 1))
                if [ "$sans_nouveau" -gt 24 ]; then
                  echo "::error title=Déploiement $service::aucun nouveau déploiement deux minutes après le téléversement"
                  return 1
                fi
                sleep 5
                continue
              fi

              case "$statut" in
                SUCCESS)
                  echo "✓ $service — déploiement $id en service"
                  echo "$service|$id|SUCCESS" >> "$RUNNER_TEMP/deploiements.txt"
                  return 0
                  ;;
                FAILED|CRASHED|SKIPPED|REMOVED)
                  echo "::error title=Déploiement $service::état $statut (déploiement $id)"
                  echo "$service|$id|$statut" >> "$RUNNER_TEMP/deploiements.txt"
                  echo "───── 80 dernières lignes de construction ($service) ─────"
                  railway logs --environment "$ENVIRONNEMENT" --service "$service" --build --lines 80 "$id" 2>&1 | tail -80 || true
                  echo "───── 80 dernières lignes d'exécution ($service) ─────"
                  railway logs --environment "$ENVIRONNEMENT" --service "$service" --deployment --lines 80 "$id" 2>&1 | tail -80 || true
                  return 1
                  ;;
                *) sleep 5 ;;
              esac
            done

            echo "::error title=Déploiement $service::état non terminal après 20 minutes"
            return 1
          }
          SCRIPT
          echo "Procédure écrite dans $RUNNER_TEMP/deployer.sh"

      # ── L'api d'abord, seule ──────────────────────────────────────────────
      # Elle porte le preDeployCommand Railway `pnpm verify:postgres:built` :
      # avec le seul rôle runtime, il prouve que le job privilégié a migré la
      # même base avant d'autoriser la nouvelle API à démarrer.
      - name: Déployer api — schémas PostgreSQL vérifiés
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/deployer.sh"
          deployer api

      # ── Puis les trois interfaces, ensemble ───────────────────────────────
      # Elles ne dépendent que de l'api, qui est déjà en service. Les lancer en
      # parallèle divise l'attente par trois ; les journaux sont séparés puis
      # réaffichés dans l'ordre, sinon ils s'entrelacent et ne servent à rien.
      - name: Déployer web, pos et kds
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/deployer.sh"

          pids=''
          for service in web pos kds; do
            ( deployer "$service" ) > "$RUNNER_TEMP/$service.log" 2>&1 &
            pids="$pids $!:$service"
          done

          echec=0
          for couple in $pids; do
            pid="${couple%%:*}"
            service="${couple##*:}"
            if wait "$pid"; then
              resultat='✓'
            else
              resultat='✗'
              echec=1
            fi
            echo "$resultat $service"
          done

          for service in web pos kds; do
            echo "───────────── journal $service ─────────────"
            cat "$RUNNER_TEMP/$service.log"
          done

          exit "$echec"

      - name: Récapituler les déploiements
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Déploiements Railway — \`${ENVIRONNEMENT}\`"
            echo
            echo "| Service | Identifiant du déploiement | État |"
            echo "|---|---|---|"
            if [ -s "$RUNNER_TEMP/deploiements.txt" ]; then
              while IFS='|' read -r service id statut; do
                [ -n "$service" ] || continue
                echo "| \`$service\` | \`$id\` | $statut |"
              done < "$RUNNER_TEMP/deploiements.txt"
            else
              echo "| — | aucun déploiement enregistré | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 5 · La santé
  #
  # Ce job ne reçoit AUCUN secret — pas de RAILWAY_TOKEN, rien. C'est la preuve
  # structurelle que `scripts/smoke.mjs` ne tape que des surfaces publiques :
  # s'il avait besoin d'un secret, il échouerait ici.
  #
  # Il échoue en rouge, et son échec est celui du déploiement : « c'est en
  # ligne » et « ça marche » sont deux affirmations différentes.
  # ───────────────────────────────────────────────────────────────────────────
  sante:
    name: Santé après déploiement
    needs: [cible, migrations, deploiement]
    # `always()` : on contrôle la santé MÊME si la mise en ligne a échoué.
    # Un vendredi soir, la première question n'est pas « le déploiement
    # est-il passé ? » mais « le restaurant peut-il encaisser ? ». Quand
    # Railway refuse une mise en service, l'ancienne version continue de
    # servir — et il faut le SAVOIR, pas le supposer.
    # En revanche, si la vérification a échoué, `deploiement` est « skipped » :
    # on n'a rien touché, il n'y a rien à contrôler.
    # Une migration peut avoir appliqué supply puis échoué sur fidélité/customer. Même
    # sans nouveau conteneur, on contrôle alors immédiatement l'ancien service.
    # Si le préflight/CI a bloqué avant tout DDL, migrations est skipped et le
    # smoke reste inutile.
    if: always() && needs.cible.result == 'success' && needs.migrations.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Rappeler dans quel cas on se trouve
        env:
          RESULTAT: ${{ needs.deploiement.result }}
          RESULTAT_MIGRATIONS: ${{ needs.migrations.result }}
          ENVIRONNEMENT: ${{ needs.cible.outputs.environnement }}
        run: |
          set -euo pipefail
          if [ "$RESULTAT_MIGRATIONS" != 'success' ]; then
            echo "::warning title=Migrations en échec::Le contrôle public vérifie que l'ancienne API de $ENVIRONNEMENT reste opérationnelle après une migration potentiellement partielle."
          fi
          if [ "$RESULTAT" != 'success' ]; then
            echo "::warning title=Mise en ligne en échec::Le contrôle qui suit dit ce que « $ENVIRONNEMENT » sert MAINTENANT — donc, très probablement, la version PRÉCÉDENTE. Vert ici ne veut pas dire que le déploiement a réussi."
          fi

      # Aucun `pnpm install` : le script n'a aucune dépendance, par exigence.
      - name: Vérifier les surfaces publiques
        env:
          ENVIRONNEMENT: ${{ needs.cible.outputs.environnement }}
          # ── Ce qui fait passer le contrôle de « ça répond » à « c'est MA
          # révision qui répond » ──────────────────────────────────────────
          # Le script compare ce SHA à celui que `GET /health` publie. Sans
          # cette ligne il ne pourrait que constater qu'une API est vivante —
          # ce qu'elle serait tout autant avec la version d'avant en ligne.
          #
          # Renseignée SEULEMENT si la mise en ligne a réussi. Quand elle a
          # échoué, l'ancienne version sert forcément : exiger la nouvelle
          # rendrait rouge un contrôle dont la seule question utile, ce
          # soir-là, est « le restaurant peut-il encaisser ? ». Le contrôle
          # s'annonce alors IGNORÉ, et la révision réellement servie reste
          # affichée dans le contrôle précédent.
          SM_REVISION_ATTENDUE: ${{ needs.deploiement.result == 'success' && github.sha || '' }}
          # Variable PUBLIQUE, volontairement absente tant qu'aucun restaurant
          # n'existe en production. Staging conserve son slug intégré au
          # script ; une valeur vide garde les contrôles tenant en IGNORÉ.
          SM_SLUG_CARTE_PRODUCTION: ${{ vars.SM_SLUG_CARTE_PRODUCTION }}
        run: node scripts/smoke.mjs "$ENVIRONNEMENT"

      - name: Annoncer la panne
        if: failure()
        env:
          ENVIRONNEMENT: ${{ needs.cible.outputs.environnement }}
        run: |
          echo "::error title=Déploiement en échec::$ENVIRONNEMENT : le code est EN LIGNE mais une surface ne répond pas. Retour arrière → docs/CI-CD.md § 12."

name: Secrets

# Fichier séparé de ci.yml volontairement : cela donne un contrôle distinct,
# exigible tel quel par la protection de « main », et un échec qui se lit sans
# ambiguïté — « il y a un secret dans ce diff », pas « la CI est rouge ».
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # gitleaks-action interroge GET /repos/{o}/{r}/pulls/{n}/commits pour délimiter
  # la plage à balayer. Sans cette permission : 403 « Resource not accessible by
  # integration », et l'action tombe avant même d'avoir balayé quoi que ce soit.
  pull-requests: read

jobs:
  gitleaks:
    name: Balayage des secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Version figée : un balayage dont les règles changent toutes seules n'est
      # pas un garde-fou, c'est une surprise. À relever volontairement.
      VERSION_GITLEAKS: 8.30.1

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          # gitleaks-action a besoin de l'historique complet pour délimiter la
          # plage de commits à balayer.
          fetch-depth: 0

      # ── 1. Le diff ────────────────────────────────────────────────────────
      # L'action officielle balaie les commits apportés par la pull request
      # (ou par le push sur main). C'est le contrôle qui empêche un secret
      # d'ENTRER : il échoue sur le commit fautif, avant la fusion.
      - name: Balayer les commits apportés
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.github/gitleaks.toml
          GITLEAKS_VERSION: ${{ env.VERSION_GITLEAKS }}
          # Le dépôt appartient à un compte personnel : aucune licence requise.
          # Sur un compte d'organisation, il faudrait ajouter GITLEAKS_LICENSE
          # (gratuite, à demander sur gitleaks.io) sans quoi l'action refuse de
          # s'exécuter.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # ── 2. L'arbre tel qu'il est ──────────────────────────────────────────
      # Le balayage du diff ne dit rien d'un secret entré AVANT la mise en place
      # de cette CI. Cette seconde passe relit l'intégralité des fichiers de la
      # révision courante, sans passer par l'historique.
      - name: Installer gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION_GITLEAKS}/gitleaks_${VERSION_GITLEAKS}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Balayer l'arbre courant
        run: |
          set -euo pipefail
          gitleaks dir . \
            --config .github/gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
